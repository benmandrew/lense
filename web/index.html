<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>lense</title>
  <meta name="description" content="C and C++ record layouts, computed by clang in the browser">
  <!-- The PNGs are rendered from favicon.svg:
       rsvg-convert -w 32 favicon.svg -o favicon.png
       sed 's/ rx="6"//' favicon.svg | rsvg-convert -w 180 -o apple-touch-icon.png -->
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="icon" href="favicon.png" type="image/png" sizes="32x32">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <!-- og.png comes from `npm run thumbnail`. -->
  <meta property="og:title" content="lense">
  <meta property="og:description" content="C and C++ record layouts, computed by clang in the browser">
  <meta property="og:type" content="website">
  <meta property="og:image" content="og.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="C++ source for struct Circle next to its byte map: vptr, the inherited member id, tag, three bytes of padding, and radius">
  <meta name="twitter:card" content="summary_large_image">
</head>
<body>
  <header class="bar">
    <h1>lense</h1>
    <label>Example <select id="example"></select></label>
    <label>Language
      <select id="lang">
        <option value="c++">C++</option>
        <option value="c">C</option>
      </select>
    </label>
    <label>Standard <select id="std"></select></label>
    <label>Target
      <select id="target">
        <option value="x86_64-linux-gnu">x86-64 Linux</option>
        <option value="i686-linux-gnu">x86 Linux (32-bit)</option>
        <option value="aarch64-linux-gnu">AArch64 Linux</option>
        <option value="armv7-linux-gnueabihf">ARMv7 Linux</option>
        <option value="riscv64-linux-gnu">RISC-V 64 Linux</option>
        <option value="wasm32-unknown-unknown">wasm32</option>
        <option value="x86_64-pc-windows-msvc">x86-64 Windows (MSVC)</option>
        <option value="i686-pc-windows-msvc">x86 Windows (MSVC)</option>
        <option value="arm64-apple-macos">ARM64 macOS</option>
      </select>
    </label>
    <label>Compare with
      <select id="compare"><option value="">off</option></select>
    </label>
    <label>Cache line
      <select id="cacheline">
        <option value="64">64 bytes</option>
        <option value="0">off</option>
        <option value="32">32 bytes</option>
        <option value="128">128 bytes</option>
      </select>
    </label>
    <label><input type="checkbox" id="expand"> expand system types</label>
    <label class="grow">Flags <input id="flags" spellcheck="false" placeholder="-DN=4 -fms-extensions"></label>
    <span id="status" role="status" aria-live="polite"></span>
  </header>
  <main>
    <section id="editor" aria-label="Source"></section>
    <section id="output" aria-label="Layouts"></section>
  </main>
  <div id="tip" role="tooltip" hidden></div>
  <script type="module" src="./src/main.ts"></script>
</body>
</html>
